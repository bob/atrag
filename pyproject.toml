[project]
name = "atrag"
version = "0.1.0"
description = "Preparation and retrieval of Portuguese tax documents"
readme = "README.md"
authors = [
    { name = "Vadym Kalion", email = "1436+bob@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.16,<2",
    "langchain>=1.4.7",
    "langchain-openai>=1.7.3",
    "langgraph>=1.2.19",
    "langgraph-checkpoint-postgres>=3,<4",
    "openai>=2,<3",
    "pdfplumber>=0.11,<0.12",
    "pgvector>=0.4,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic>=2.12,<3",
    "python-dotenv>=1.1,<2",
    "sqlalchemy>=2.0,<3",
    "streamlit[auth]>=1.66.1",
    "tiktoken>=0.12,<1",
]

[project.scripts]
atrag = "atrag.cli:main"

[tool.ruff]
# Keep syntax compatible with Pylance versions targeting Python before 3.14.
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a dedicated local PostgreSQL test database"]

[tool.coverage.run]
source = ["atrag"]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "ty>=0.0.95",
]
